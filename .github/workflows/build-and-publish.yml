name: Build and Publish

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cmg-hospitalizacion-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cmg_test
          MYSQL_USER: cmg
          MYSQL_PASSWORD: cmg_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: cmg_test
      DB_USERNAME: cmg
      DB_PASSWORD: cmg_test
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, gd, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Run maintained tests
        run: |
          php artisan test \
            tests/Unit/CmgDelegatedAuthServiceTest.php \
            tests/Unit/MedicationOrderScheduleTest.php \
            tests/Feature/Api/WarehouseActivePatientsApiTest.php \
            tests/Feature/Api/WarehouseNursesApiTest.php \
            tests/Feature/CmgDelegatedAccessTest.php

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cmg
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_PORT: '39876'
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' APP_PORT='$APP_PORT' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="$HOME/cmg"
          ENV_FILE="$APP_DIR/.env"
          CONTAINER="cmg"
          ROLLBACK_CONTAINER="cmg-rollback"
          IMAGE="$DOCKERHUB_USERNAME/cmg:$IMAGE_TAG"
          OLD_IMAGE=""

          is_healthy() {
              curl -fsS "http://127.0.0.1:$APP_PORT/up" >/dev/null
          }

          rollback() {
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

              if docker inspect "$ROLLBACK_CONTAINER" >/dev/null 2>&1; then
                  echo "Restaurando versión anterior..."
                  docker rename "$ROLLBACK_CONTAINER" "$CONTAINER"
                  docker start "$CONTAINER"

                  for i in $(seq 1 20); do
                      if is_healthy; then
                          echo "Rollback completado correctamente a: $OLD_IMAGE"
                          return 0
                      fi

                      sleep 2
                  done

                  echo "CRÍTICO: el rollback tampoco respondió."
                  return 1
              fi

              echo "No existe contenedor anterior para rollback."
              return 1
          }

          if [ ! -f "$ENV_FILE" ]; then
              echo "No existe el archivo $ENV_FILE"
              exit 1
          fi

          echo "Descargando nueva imagen..."
          docker pull "$IMAGE"

          docker rm -f "$ROLLBACK_CONTAINER" >/dev/null 2>&1 || true

          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              OLD_IMAGE=$(docker inspect "$CONTAINER" --format='{{.Config.Image}}')
              echo "Versión anterior: $OLD_IMAGE"
              docker stop "$CONTAINER"
              docker rename "$CONTAINER" "$ROLLBACK_CONTAINER"
          else
              echo "No existe una versión anterior."
          fi

          echo "Levantando nueva versión..."

          if ! docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$APP_PORT:80" \
              -v "$ENV_FILE:/var/www/html/.env:ro" \
              "$IMAGE"
          then
              echo "No fue posible iniciar la nueva versión."
              rollback || true
              exit 1
          fi

          for i in $(seq 1 20); do
              if docker exec "$CONTAINER" php artisan --version >/dev/null 2>&1; then
                  break
              fi

              if [ "$i" -eq 20 ]; then
                  echo "El contenedor no terminó de iniciar."
                  docker logs --tail 100 "$CONTAINER" || true
                  rollback || true
                  exit 1
              fi

              sleep 2
          done

          echo "Preparando Laravel..."
          if ! docker exec "$CONTAINER" php artisan migrate --force \
              || ! docker exec "$CONTAINER" php artisan config:cache \
              || ! docker exec "$CONTAINER" php artisan route:cache \
              || ! docker exec "$CONTAINER" php artisan view:cache
          then
              echo "La preparación de Laravel o las migraciones fallaron."
              docker logs --tail 100 "$CONTAINER" || true
              rollback || true
              exit 1
          fi

          echo "Comprobando nueva versión..."

          for i in $(seq 1 20); do
              if is_healthy; then
                  echo "Nueva versión saludable."
                  docker rm -f "$ROLLBACK_CONTAINER" >/dev/null 2>&1 || true
                  echo "Deploy completado correctamente con imagen: $IMAGE"
                  exit 0
              fi

              echo "Intento $i/20: aplicación todavía no disponible..."
              sleep 2
          done

          echo "La nueva versión no respondió correctamente."
          docker logs --tail 100 "$CONTAINER" || true
          rollback || true
          exit 1
          REMOTE
